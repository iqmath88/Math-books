function eqFrame(t,anch){
  if(!LAY) measure();
  let c=-1; ST.forEach((st,i)=>{ if(t>=st.t) c=i; });
  Object.values(els).forEach(e=>{ e.style.opacity=0; });
  if(c<0) return;
  const st=ST[c], u=cl((t-st.t)/TR), ue=eio(u), ub=back(u), prev=c>0?ST[c-1]:null, Lp=c>0?LAY[c-1]:{}, Lc=LAY[c];
  const put=(e,p,o,s)=>{ e.style.opacity=o; e.style.transform=`translate(${p.x-e.offsetWidth/2}px,${p.y-e.offsetHeight/2}px) scale(${s})`; };
  const into=st.into||{}, from=st.from||{};
  /* incoming tokens */
  for(const k in Lc){ const e=els[c+':'+k], to=Lc[k]; let fr=null, s0=st.s;
    if(Lp[k]) { fr=Lp[k]; s0=prev.s; } else if(into[k]&&Lp[into[k][0]]) { fr=Lp[into[k][0]]; s0=prev.s; } else if(from[k]&&anch[from[k]]) { fr=anch[from[k]]; s0=.45; }
    if(fr){ const same=Lp[k]&&prev.rows.flat().find(x=>x[0]===k)[1]===st.rows.flat().find(x=>x[0]===k)[1];
      put(e,{x:lerp(fr.x,to.x,ue),y:lerp(fr.y,to.y,ue)},same?1:ue,lerp(s0,st.s,ue)*(from[k]&&!Lp[k]?(.9+.1*ub):1)); }
    else put(e,{x:to.x,y:to.y+30*(1-ue)},ue,st.s*(.92+.08*ub));
  }
  /* outgoing tokens of the previous state (only during the transition) */
  if(prev&&u<1) for(const k in Lp){ const e=els[(c-1)+':'+k]; if(!e) continue;
    const sameTx=Lc[k]&&prev.rows.flat().find(x=>x[0]===k)[1]===st.rows.flat().find(x=>x[0]===k)[1]; if(sameTx) continue;
    let to=Lc[k]; if(!to){ for(const nk in into) if(into[nk].includes(k)) to=Lc[nk]; }
    const p=Lp[k]; if(to) put(e,{x:lerp(p.x,to.x,ue),y:lerp(p.y,to.y,ue)},1-ue,lerp(prev.s,st.s,ue)); else put(e,{x:p.x,y:p.y-30*ue},1-ue,prev.s); }
}

/* ================= captions (one short line per narration beat) ================= */
const CAP={p1:'القاعدة مربعة · الضلع 2 m',p2:'تسرّب ⇐ الحجم يتناقص ⇐ إشارة سالبة',p3:'المطلوب: dh/dt',t1:'الماء = متوازي سطوح',t2:'A = 2 × 2 = 4 m² ثابتة',
 r1:'العلاقة الرئيسية: V = 4h',r2:'نشتق بالنسبة للزمن t',r3:'كل ساعة: طبقة حجمها 4 × سُمكها',s1:'نعوّض dV/dt = −0.4',s2:'نقسم الطرفين على 4',s3:'',y1:'السالب = انخفاض · 10 cm كل ساعة',e1:''};
const capBidi=s=>s.replace(/([A-Za-z0-9][A-Za-z0-9 =×·/²³.−\-]*[A-Za-z0-9²³?])/g,'<bdi dir="ltr">$1</bdi>');

/* ================= frame ================= */
function render(t){
  rig(t);
  const h=hAt(t), V=A*h, fl=flowing(t);
  /* hook: darkness → a light sweep reveals the tank */
  const lit=eo(cl((t-.1)/1.6)), endDim=cl((t-(DUR-1.4))/1.2);
  key.intensity=1.6*lit*(1-endDim); key.position.set(6*Math.cos(1.2+lit*1.1),7,6*Math.sin(1.2+lit*1.1)); hemi.intensity=.7*lit*(1-endDim); rim.intensity=.9*(.3+.7*lit);
  /* transformation: glass → turquoise wireframe model, back to the real tank for the payoff */
  const mdl=cl((t-S('t1')+.4)/1.4)*(1-cl((t-S('y1')+.4)/1.2));
  glassM.opacity=.13*(1-mdl); edgeM.color.setRGB(lerp(.85,.18,mdl),lerp(.95,.9,mdl),lerp(1,.78,mdl)); edgeM.opacity=.85;
  wEdgeM.opacity=mdl; waterM.opacity=lerp(.62,.28,mdl); waterM.emissiveIntensity=lerp(.35,.15,mdl);
  standM.opacity=tapM.opacity=1-.85*mdl; floorM.opacity=1-.5*mdl;
  water.scale.set(a*.994,h,a*.994); water.position.y=h/2; wEdge.scale.set(a*.998,h,a*.998); wEdge.position.y=h/2; surf.position.y=h+.002;
  drops.forEach((m,i)=>{ const ph=((t*1.7)+i/drops.length)%1; m.visible=fl; if(!fl) return; m.position.set(Math.sin(i*7.1)*.02,.12-ph*ph*.9,a/2+.3+ph*.45); m.material.opacity=.9*(1-ph*.5); });
  const lost=A*(h0-h); puddle.scale.setScalar(.25+.45*Math.sqrt(Math.max(0,lost))); pudM.opacity=.45*(1-.85*mdl);
  dust.rotation.y=t*.02; dust.material.opacity=.45*lit;
  /* shot 2: givens drawn on the object */
  const g1=cl((t-S('p1')-.3)/.7), g1o=g1*(1-cl((t-S('t2')-.4)/.5));   /* the "2 m" labels leave to become (2)(2) */
  const e1=eo(g1);
  setT(mB1,V3(-a/2,.03,a/2+.14),V3(-a/2+a*e1,.03,a/2+.14),g1*(1-cl((t-S('y1')+.4)/.6)));
  setT(mB2,V3(a/2+.14,.03,a/2),V3(a/2+.14,.03,a/2-a*e1),g1*(1-cl((t-S('y1')+.4)/.6)));
  const gq=cl((t-S('p2')-.6)/.6), gqo=gq*(1-cl((t-S('t1')+.4)/.6)), gqb=cl((t-S('s1')+.2)/.4)*(1-cl((t-S('s1')-.9)/.4));
  arrM.opacity=Math.max(gqo,gqb); arr.scale.setScalar(.6+.4*eo(gq));
  const gh=cl((t-S('p3')-.2)/.6);
  setT(mH,V3(-a/2-.16,0,a/2),V3(-a/2-.16,h*eo(gh),a/2),gh);
  const ba=cl((t-S('t2')-.2)/.6)*(1-cl((t-S('r1')-1)/.8)); baseM.opacity=.4*ba;
  /* r3: one hour leaves as one layer (thickness 0.1 m) */
  const L0=W[1][0], L1=W[1][1], ly=win(t,S('r3')-.1,S('s1')+.4,.5,.6), hTop=h0+DHDT*4, hL=Math.abs(DHDT);
  layer.scale.set(1,Math.max(.002,t<L0?hL:hTop-h),1); layer.position.y=t<L0?hTop-hL/2:(h+hTop)/2; layerM.opacity=.5*ly*(t>L1?0:1);
  layerE.scale.set(a*1.005,hL,a*1.005); layerE.position.y=hTop-hL/2; layerEM.opacity=ly;
  setT(mL,V3(a/2+.18,hTop-hL,a/2),V3(a/2+.18,hTop,a/2),ly);
  /* payoff: three hours, three equal steps of 10 cm */
  const P0=W[2][0], P1=W[2][1], hP=h0+DHDT*5, pay=win(t,S('y1')-.2,S('e1')+1.2,.4,.8);
  goldL.intensity=3*win(t,S('s3'),S('s3')+2.4,.3,1)+2*pay;
  rings.forEach((m,i)=>{ const tk=P0+(i+1)*(P1-P0)/3; m.position.y=hP-.1*(i+1); m.material.opacity=pay*cl((t-tk+.15)/.3); });
  if(!window.NO_GL) R.render(scene,cam);
  /* anchors for symbols that leave the scene */
  const anch={water:proj(V3(0,h/2,a/2)), base:proj(V3(0,.02,0)), hl:proj(V3(-a/2-.16,h/2,a/2)), b1:proj(V3(0,.03,a/2+.14)), b2:proj(V3(a/2+.14,.03,0)), leak:proj(V3(0,.12,a/2+.7))};
  anch.hl.x-=50; anch.b1.y+=52; anch.b2.x+=64; anch.leak.y+=125;
  /* floating labels */
  place('Lb1',V3(0,.03,a/2+.14),g1o,0,52,.9+.1*back(g1)); place('Lb2',V3(a/2+.14,.03,0),g1o,64,30,.9+.1*back(g1));
  place('Lh',V3(-a/2-.16,h/2,a/2),gh*(1-cl((t-S('y1')+.4)/.4))+cl((t-S('y1')+.2)/.4)*pay,-50,0);
  place('LA',V3(0,.03,0),ba*(1-cl((t-S('t2')-.4)/.4)),0,0);
  const cq=place('Cq',V3(0,.12,a/2+.7),gqo,0,125,.85+.15*back(gq));
  place('Ch',V3(-a/2-.16,h*eo(gh),a/2),gh*(1-cl((t-S('t1')+.4)/.6)),-40,-70,.85+.15*back(gh));
  $('Cl').innerHTML=t<L1?'طبقة سُمكها <bdi dir=ltr>Δh</bdi> ⇐ حجمها <bdi dir=ltr>4·Δh</bdi>':'ساعة: <bdi dir=ltr>Δh = 0.1 m</bdi> ⇐ <bdi dir=ltr>4 × 0.1 = 0.4 m³</bdi>';
  place('Cl',V3(0,hTop,a/2),ly,0,-90);
  ['R1','R2','R3'].forEach((id,i)=>place(id,V3(a/2+.1,hP-.1*(i+1),a/2),rings[i].material.opacity,120,0));
  /* type layers */
  $('tag').style.opacity=win(t,S('p1')-.2,S('e1')-.4,.5,.5);
  const ho=cl((t-.25)/.5)*(1-cl((t-S('p1')+.6)/.4)); $('hook').style.opacity=ho; $('hook').style.filter=`blur(${(1-eo(cl((t-.25)/.6)))*12}px)`; $('hook').style.transform=`scale(${1.08-.08*eo(cl((t-.25)/.9))})`;
  $('tl').style.opacity=fl?1:0; $('tl').textContent=t<W[0][1]+.1?'زمن مسرَّع ×'+Math.round(W[0][2]*3600/(W[0][1]-W[0][0]))+' · t = '+tau(t).toFixed(1)+' h':'t = '+tau(t).toFixed(1)+' h';
  eqFrame(t,anch);
  let ck=null; window.TL.forEach(([k,s,d])=>{ if(t>=s-.15&&t<s+d+.45) ck=k; }); const tx=ck?(CAP[ck]||''):''; const cs=$('cap').firstChild;
  if(cs.dataset.k!==tx){ cs.dataset.k=tx; cs.innerHTML=capBidi(tx); } $('cap').style.opacity=tx?1:0;
  $('mid').style.opacity=win(t,S('e1')-.2,DUR-.9,.5,.5); $('mid').style.transform=`translateY(${20*(1-eo(cl((t-S('e1')+.2)/.6)))}px)`;
  $('brand').style.opacity=win(t,S('e1')+1.0,DUR-.6,.6,.5);
  $('fade').style.opacity=t<.1?1:Math.max(cl(1-(t-.1)/.4)*0,endDim*.9);
  window.STATE={t,h,V,tau:tau(t),flowing:fl,mdl};
}
window.render=render;

/* ================= preview player ================= */
const aud=$('aud'); let playing=false;
function fit(){ const st=$('stage'); if(RENDER) return; const k=Math.min(innerWidth/1080,innerHeight/1920); st.style.transform=`translate(${(innerWidth-1080*k)/2}px,${(innerHeight-1920*k)/2}px) scale(${k})`; }
function tick(){ if(!playing) return; const t=aud.currentTime; render(Math.min(t,DUR)); if(aud.ended){ playing=false; $('play').textContent='↺ إعادة'; return; } requestAnimationFrame(tick); }
$('play').onclick=()=>{ if(playing){ aud.pause(); playing=false; $('play').textContent='▶ متابعة'; } else { if(aud.ended) aud.currentTime=0; aud.play(); playing=true; $('play').textContent='⏸ إيقاف'; tick(); } };
addEventListener('resize',fit); fit();
document.fonts.ready.then(()=>{ measure(); render(RENDER?0:S('r1')+1); }); render(0);
</script>
