function render(t){

           [C(3)+0.2,1,540,800],[C(4),1,540,800],[CE(4)+0.2,1,540,800],[C(5),1.04,540,760],[C(6)-0.4,1.04,540,760],[C(6)+0.4,1,540,800],[50,1,540,800]];
