const put = (el, p, o, s = 1) => { el.style.opacity = o; el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%) scale(${s})`; };

  const hy = lerp(1290, 196, hudUp);

  const CX = 495, CY = 1262;

  const L3 = EQ.layout(['V', 'eq', 'four', 'h'], CX, CY, 28, { h: -16 });
  const m12 = eio(ramp(t, C.s1 - .15, .5)), m23 = eio(ramp(t, C.res + .05, .7));
  const lay = id => { const a = L1[id], b = L2[id] || L1[id], c = L3[id] || b; return EQ.mix(EQ.mix(a, b, m12), c, m23); };
  /* V: lifts off the water on "الحجم" */
  { const u = eio(ramp(t, C.law + .05, .65)); const p = EQ.arc(pV, lay('V'), u, 90); EQ.put('V', { ...p, s: lerp(.55, 1, u), o: cl(ramp(t, C.law + .05, .2)), glow: 1 - u * .7 }); }
  EQ.put('eq', { ...lay('eq'), o: eo(ramp(t, C.law + .55, .35)) });
  /* A: rises from the area square on "مساحة"; splits into (2)(2) on "اثنان" */
  { const u = eio(ramp(t, C.A + 1.0, .7)); const p = EQ.arc({ x: pA.x, y: pA.y }, L1.A, u, 140); const out = ramp(t, C.s1 + .3, .3);   /* A dissolves as the first (2) lands in its place */
    EQ.put('A', { ...(u < 1 ? p : EQ.mix(L1.A, L2.p2a, m12)), s: lerp(.5, 1, u) * (1 - .4 * out), o: cl(ramp(t, C.A + 1.0, .2)) * (1 - out), glow: (1 - u) * .8 }); }
  /* h: leaves the height bracket on "الارتفاع" */
  { const u = eio(ramp(t, C.H + .7, .7)); const p = EQ.arc({ x: pH.x - 34, y: pH.y }, lay('h'), u, 120); EQ.put('h', { ...p, s: lerp(.6, 1, u) * (1 + .18 * win(t, C.sh - .05, C.sh + .45, .12, .3)), o: cl(ramp(t, C.H + .7, .15)), glow: Math.max(1 - u, win(t, C.sh - .05, C.sh + .5, .12, .35)) }); }
  /* the two 2s fly from the dimension labels into the formula on "اثنان" / "اثنين" */
  for (const [id, cue, from] of [['p2a', C.s1, { x: pF.x, y: pF.y + 46 }], ['p2b', C.s2, { x: pR.x + 30, y: pR.y + 34 }]]) {
    const u = eio(ramp(t, cue - .05, .62)); const fuse = eio(ramp(t, C.res + .05, .55));

    EQ.put(id, { ...p, s: lerp(.45, 1, u) * (1 - .5 * fuse), o: cl(ramp(t, cue - .05, .15)) * (1 - ramp(t, C.res + .4, .25)), glow: (1 - u) + fuse * .6 });
  }
  /* (2)(2) → 4 */
  { const u = ramp(t, C.res + .45, .5); EQ.put('four', { ...L3.four, s: lerp(.4, 1, back(u)) * (1 + .12 * win(t, C.four - .05, C.four + .6, .12, .4)), o: cl(u * 2), glow: .4 + .6 * win(t, C.four - .05, C.four + .9, .15, .5) }); }
  /* gold frame draws around V = 4h on "أربعة" */
  { const a = L3.V, b = L3.h, x0 = a.x - EQ.A.V.w / 2 - 40, x1 = b.x + EQ.A.h.w / 2 + 40, y0 = CY - 92, y1 = CY + 92, per = 2 * (x1 - x0 + y1 - y0);
    box.setAttribute('x', x0); box.setAttribute('y', y0); box.setAttribute('width', x1 - x0); box.setAttribute('height', y1 - y0);
    const u = eio(ramp(t, C.four, .8)); box.setAttribute('stroke-dasharray', per); box.setAttribute('stroke-dashoffset', per * (1 - u)); box.style.opacity = u > 0 ? 1 : 0;
    box.style.filter = `drop-shadow(0 0 ${14 * u}px rgba(216,178,90,.8))`; }
  $('note').style.opacity = eo(ramp(t, C.four + .4, .4)) * (1 - ramp(t, C.diff - .2, .4)); $('note').style.transform = `translateY(${(1 - eo(ramp(t, C.four + .7, .5))) * 18}px)`;

  /* ---- ACT 4–6: derivative → substitution → division → result ---- */
  const CY2 = 1300, u1 = eio(ramp(t, C.diff - .05, .8)), Y1 = lerp(CY, 1108, u1), S1 = lerp(1, .6, u1);
  /* row 1 (V = 4h) steps up and shrinks to make room for the derivative; it stays visible as the reason for row 2 */
  const P1 = {}; for (const id of ['V', 'eq', 'four', 'h']) { const L = EQ.A[id].last; if (!L) continue;
    const P = { x: CX + (L.x - CX) * S1, y: Y1 + (L.y - CY) * S1 }; P1[id] = P; if (u1 > 0) EQ.put(id, { ...L, ...P, s: L.s * S1 }); }
  if (u1 > 0) { const x = +box.getAttribute('x'), y = +box.getAttribute('y'), w = +box.getAttribute('width'), hh = +box.getAttribute('height');
    box.setAttribute('x', CX + (x - CX) * S1); box.setAttribute('y', Y1 + (y - CY) * S1); box.setAttribute('width', w * S1); box.setAttribute('height', hh * S1); box.style.opacity = (+box.style.opacity) * lerp(1, .55, u1); }
  /* d/dt sweeps across both sides of V = 4h */
  { const u = eio(ramp(t, C.diff + .5, 1.6)); EQ.put('ddt', { x: lerp(CX - 300, CX + 300, u), y: Y1 - 4, o: win(t, C.diff + .35, C.d1 + .1, .3, .35), glow: 1 }); }
  const R4 = EQ.layout(['dV', 'eq2', 'four2', 'dh'], CX, CY2, 26, { dh: -14 });
  const R5 = EQ.layout(['n04', 'eq2', 'four2', 'dh'], CX, CY2, 26, { eq2: 16, dh: -14 });
  const fracW = Math.max(EQ.A.n04.w, EQ.A.bar.w), R6w = EQ.A.dh.w + 26 + EQ.A.eq2.w + 26 + fracW, x6 = CX - R6w / 2;
  const R6 = { dh: { x: x6 + EQ.A.dh.w / 2, y: CY2 }, eq2: { x: x6 + EQ.A.dh.w + 26 + EQ.A.eq2.w / 2, y: CY2 } }; const fx = x6 + R6w - fracW / 2;
  Object.assign(R6, { n04: { x: fx, y: CY2 - 58 }, bar: { x: fx, y: CY2 + 4 }, four2: { x: fx, y: CY2 + 62 } });
  const R7 = EQ.layout(['dh', 'eq2', 'r01', 'unit'], CX, CY2, 24, { unit: -12 });
  const m45 = eio(ramp(t, C.div + .1, .9)), m67 = eio(ramp(t, C.ansv - .15, .6));
  const m5 = eio(ramp(t, C.sub2 + .2, .6));
  const lay2 = id => { const a = R4[id] || R5[id], b = R5[id] || a, c = R6[id] || b, d = R7[id] || R7.r01; return EQ.mix(EQ.mix(EQ.mix(a, b, m5), c, m45), d, m67); };
  /* each symbol is born from its parent in V = 4h (Transform Matching) */

  }

  const pN = project(NZ); const chip = t < C.law ? { x: pN.x - 70, y: pN.y + 96 } : { x: Math.min(pN.x + 190, 780), y: pN.y + 30 };   /* act 5: beside the valve, clear of V = 4h */
  { const u = eio(ramp(t, C.sub2 - .05, .75)); const p = u < 1 ? EQ.arc(chip, R5.n04, u, 150) : lay2('n04');
    EQ.put('n04', { ...p, s: lerp(.55, 1, u) * lerp(1, .85, m45), o: cl(ramp(t, C.sub2 - .05, .15)) * (1 - ramp(t, C.ansv + .1, .3)), glow: Math.max(1 - u, win(t, C.m04 - .05, C.m04 + 1, .1, .4) * 0) }); }
  { const u = eio(ramp(t, C.div + .45, .5)); const a = EQ.A.bar; EQ.put('bar', { ...R6.bar, s: 1, o: u * (1 - ramp(t, C.ansv + .1, .3)) }); a.el.style.transform += ` scaleX(${u})`; }
  /* −0.4 / 4 fuses into −0.1 m/h */
  { const u = ramp(t, C.ansv + .15, .5); EQ.put('r01', { ...R7.r01, s: lerp(.4, 1, back(u)), o: cl(u * 2), glow: .4 + .6 * win(t, C.ansv, C.ansv + 1.4, .2, .6) });
    const v = ramp(t, C.ansv + .7, .45); EQ.put('unit', { ...R7.unit, s: lerp(.6, 1, back(v)) * (1 + .22 * win(t, C.unit, C.unit + 1.3, .15, .5)), o: cl(v * 2), glow: win(t, C.unit, C.unit + 1.6, .15, .6) }); }
  { const a = R7.dh, b = R7.unit, x0 = a.x - EQ.A.dh.w / 2 - 36, x1 = b.x + EQ.A.unit.w / 2 + 36, y0 = CY2 - 108, y1 = CY2 + 108, per = 2 * (x1 - x0 + y1 - y0), box2 = $('box2');
    box2.setAttribute('x', x0); box2.setAttribute('y', y0); box2.setAttribute('width', x1 - x0); box2.setAttribute('height', y1 - y0);
    const u = eio(ramp(t, C.ansv + 1.0, .8)); box2.setAttribute('stroke-dasharray', per); box2.setAttribute('stroke-dashoffset', per * (1 - u)); box2.style.opacity = u > 0 ? 1 : 0;
    box2.style.filter = `drop-shadow(0 0 ${(10 + 14 * win(t, C.unit, C.unit + 1.4, .2, .5)) * u}px rgba(216,178,90,.85))`; }
  /* rate chip at the valve: given data (act 2), recalled when the sign is discussed (act 5) */
  put($('Lrate'), chip, Math.max(win(t, C.rate - .05, C.idea + .2, .35, .35), win(t, C.m04 - .2, C.sub2 + .5, .3, .3)), 1 + .08 * win(t, C.m04, C.m04 + 1.2, .15, .4));

    put($('Lar2'), { x: pa.x - 170, y: pa.y }, ramp(t, C.ansv + .9, .4)); }
  /* ---- ACT 7: result → reality ---- */
  { const o = cl(ramp(t, C.real - .2, .6)) * (1 - .6 * ramp(t, C.why + .3, .6)), x = -1 - OFF, z = 1;
    ruler.forEach((m, i) => { const y = Y0 + i * 0.1, L = i % 5 === 0 ? .2 : .11, k = eo(ramp(t, C.real - .2 + i * .03, .4)); setTube(THREE, m, V3(x, y, z), V3(x - L * k, y, z)); m.material.opacity = o; m.visible = o > .01 && y <= Y0 + M.H + 1e-6; });

    slab.position.set(0, Y0 + h + 0.05, 0);   /* the layer the water occupied one hour ago: h(τ−1) − h(τ) = 0.1 m */
    const ps = project(V3(-1.05, Y0 + h + .05, 1.05)); put($('Lslab'), { x: Math.max(ps.x - 40, 250), y: ps.y - 92 }, so);

  let ci = -1; LINES.forEach(([s, d], i) => { if (i > 0 && t >= s - .1 && t < s + d + .25) ci = i; });   /* line 1 is carried by the hook typography */

  $('cap').style.opacity = ci >= 0 ? 1 : 0;

  $('brand').style.opacity = eo(ramp(t, capEnd + .1, .5)); $('brand').style.transform = `translateY(${(1 - eo(ramp(t, capEnd + .1, .5))) * 20}px)`;
  $('fade').style.opacity = Math.max(1 - ramp(t, 0, .5), ramp(t, D - .45, .45));

};
