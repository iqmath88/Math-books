<script>
/* ---------- timing: cue i = [start, length] of narration line i (from the voice track) ---------- */

{ const c=$('grain').getContext('2d'), im=c.createImageData(600,1070); let s=7; const r=()=>(s=(s*16807)%2147483647)/2147483647; for(let i=0;i<im.data.length;i+=4){ const v=r()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } c.putImageData(im,0,0); $('grain').style.width='1200px'; $('grain').style.height='2140px'; }

E('line',{x1:60,y1:DPY(0),x2:1020,y2:DPY(0),stroke:'#6e86b5','stroke-width':2},d);

/* ---------- the moving point ---------- */
const A0=-1.6;                                  /* point used for the secant → tangent story */
function xp(t){ if(t<C(6)) return A0;          /* still while the tangent is built */
  if(t<C(7)+0.9) return lerp(A0,-1,eio(ramp(t,C(6),C(7)+0.9-C(6))));    /* rising → reaches the top as "القمة" is heard */

  if(t<C(9)) return lerp(-1,0.55,eio(ramp(t,C(8),C(9)-C(8))));           /* falling */
  if(t<C(10)) return lerp(0.55,2.05,eio(ramp(t,C(9),C(10)-C(9))));        /* recap: sweep the rest */
  return 2.05; }
function hAt(t){ if(t<C(3)) return 0.9; return lerp(0.9,0.0001,eio(ramp(t,C(3),CE(4)-C(3)))); }

function lineThrough(x,y,m,len){ /* segment centred on (x,y) with slope m in world coords, len in px */ const sx=960/(X1-X0), sy=(H-40)/(Y1-Y0), dx=1*sx, dy=-m*sy, L=Math.hypot(dx,dy); return [PX(x)-dx/L*len,PY(y)-dy/L*len,PX(x)+dx/L*len,PY(y)+dy/L*len]; }

const slopeCol=m=>m>0.05?'#ffc94a':m<-0.05?'#ff6b7d':'#ffffff';

function render(t){
  /* background drift */
  $('b1').style.transform=`translate(${-180+60*Math.sin(t*.21)}px,${120+50*Math.cos(t*.17)}px)`;
  $('b2').style.transform=`translate(${420+70*Math.cos(t*.19)}px,${1040+60*Math.sin(t*.23)}px)`;
  $('grain').style.transform=`translate(${-((t*97)%60)}px,${-((t*61)%60)}px)`;

  $('sweep').style.left=lerp(-200,1200,ramp(t,0.9,0.9))+'px'; $('sweep').style.opacity=t>0.9&&t<1.8?1:0;
  $('brand').style.opacity=ramp(t,CE(0),0.6)*cl((C(10)-t)/0.5);

  tP.setAttribute('x',PX(x)-46); tP.setAttribute('y',PY(y)-22); tP.setAttribute('opacity',pin*cl((C(6)-t)/0.4));

  tQ.setAttribute('x',PX(xq)+20); tQ.setAttribute('y',PY(yq)-20); tQ.setAttribute('opacity',qVis*cl((C(3)+1.2-t)/0.4));

  const sIn=ramp(t,C(2)+0.2,0.7); setL(sec,lineThrough((A0+xq)/2,(f(A0)+yq)/2,ms,560)); sec.setAttribute('opacity',sIn*cl((CE(4)+0.3-t)/0.5)*0.95);
  /* Δx, Δy legs */
  const lg=ramp(t,C(2)+2.2,0.6)*cl((C(3)+1.4-t)/0.5); legs.setAttribute('opacity',lg);
  setL(ldx,[PX(A0),PY(f(A0)),PX(xq),PY(f(A0))]); setL(ldy,[PX(xq),PY(f(A0)),PX(xq),PY(yq)]);
  tdx.setAttribute('x',(PX(A0)+PX(xq))/2); tdx.setAttribute('y',PY(f(A0))+42); tdx.textContent='Δx';

  else { ro.textContent="f′("+x.toFixed(2)+") = "+fmt(m); ro.style.color=slopeCol(m); ro.style.borderColor=slopeCol(m); }

  /* captions (one line per narration line) */
  let ci=-1; CUES.forEach((c,i)=>{ if(t>=c[0]-0.1&&t<c[0]+c[1]+0.35) ci=i; });
  const cap=$('cap'); const txt=ci>=0?CAPS[ci]:''; if(cap.dataset.t!==txt){ cap.dataset.t=txt; cap.innerHTML=txt?`<span>${txt.replace(/Δy|Δx/g,s=>`<b dir="ltr" style="color:${s==='Δy'?'#38d6ff':'#ffc94a'}">${s}</b>`)}</span>`:''; }
  cap.style.opacity=ci>=0&&ci<10?cl((t-CUES[ci][0]+0.1)/0.25):0;
  /* outro */
  const oi=ramp(t,C(10)-0.3,0.7); $('outro').style.opacity=oi; $('ol').style.width=lerp(0,520,eio(ramp(t,C(10),1.0)))+'px';
  g.style.opacity=1-0.85*oi; g.style.filter=`blur(${oi*6}px)`;
  $('fade').style.opacity=t<0.35?1-t/0.35:t>39.4?(t-39.4)/0.6:0;
}
window.render=render; render(0);
</script></body></html>
