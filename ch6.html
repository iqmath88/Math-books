<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المشتقات – كتاب حي</title>
<meta name="theme-color" content="#4f1a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الرياضيات الحيّة">
<style>
:root{
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .33 0 0 0 0 .2 .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --tb:60px; --pw:420px; --ph:570px; --fs:14px; --tilt:20deg; --cv:12px;
  --desk1:#8d5f3d; --desk2:#5f3b22;
  --paper:#f8f1e2; --paper2:#efe5cf; --card:#fffaf0; --ink:#2b2520; --graphite:#3a3631;
  --muted:#7d705f; --rule:#d8c9ab; --grid:rgba(90,130,170,.20); --margin-line:#e3a49a;
  --c-center:#c2410c; --c-radius:#1d4ed8; --c-std:#15803d; --c-gen:#7e22ce; --c-point:#be185d; --c-cut:#0f766e;
  --ok:#15803d; --bad:#b91c1c; --kraft:#e6cf9f; --kraft2:#cdb27a; --cover1:#7b2d1e; --cover2:#4f1a10;
  --stack1:#e8dcc2; --stack2:#cfc0a0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk1:#2c1f16; --desk2:#140d09;
    --paper:#2a251f; --paper2:#221e19; --card:#332d26; --ink:#efe6d6; --graphite:#ddd3c2;
    --muted:#a99a86; --rule:#4a4135; --grid:rgba(140,170,210,.16); --margin-line:#7a3f38;
    --c-center:#fb923c; --c-radius:#7aa7ff; --c-std:#4ade80; --c-gen:#c99bff; --c-point:#f472b6; --c-cut:#2dd4bf;
    --ok:#4ade80; --bad:#f87171; --kraft:#6b5634; --kraft2:#54432a; --cover1:#4a1c13; --cover2:#2a0f09;
    --stack1:#3a332b; --stack2:#2b261f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --desk1:#2c1f16; --desk2:#140d09;
  --paper:#2a251f; --paper2:#221e19; --card:#332d26; --ink:#efe6d6; --graphite:#ddd3c2;
  --muted:#a99a86; --rule:#4a4135; --grid:rgba(140,170,210,.16); --margin-line:#7a3f38;
  --c-center:#fb923c; --c-radius:#7aa7ff; --c-std:#4ade80; --c-gen:#c99bff; --c-point:#f472b6; --c-cut:#2dd4bf;
  --ok:#4ade80; --bad:#f87171; --kraft:#6b5634; --kraft2:#54432a; --cover1:#4a1c13; --cover2:#2a0f09;
  --stack1:#3a332b; --stack2:#2b261f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{overflow-x:hidden}
body{
  font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arial",Tahoma,sans-serif;
  color:var(--ink); overflow-x:hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 38%, rgba(255,214,160,.22), transparent 70%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.05) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89deg, rgba(255,255,255,.035) 0 1px, transparent 1px 29px),
    linear-gradient(180deg,var(--desk1),var(--desk2));
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
bdi.n,bdi.m{unicode-bidi:isolate;direction:ltr}
.m{font-family:"Cambria Math",Cambria,"Times New Roman","Noto Serif",serif;white-space:nowrap;font-size:1.04em}
.m sup,.n sup{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.02;margin:0 .1em;white-space:nowrap}
.fr>.nu{border-bottom:.08em solid currentColor;padding:0 .2em .02em}
.fr>.de{padding:.07em .2em 0}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;line-height:1.05;margin-inline-end:.15em}
.lim .ls{font-size:.6em;line-height:1;white-space:nowrap}
.lim .ls sup{font-size:.8em}
.fr .fr{font-size:.92em}
.fr sup{line-height:0}
.rad{white-space:nowrap}
.rad .rc{border-top:.075em solid currentColor;padding:.05em .1em 0;margin-inline-start:-.03em}
.rad .ri{font-size:.55em;vertical-align:.95em;margin-inline-end:-.42em}
.cc{color:var(--c-center);font-weight:700}
.cr{color:var(--c-radius);font-weight:700}
.cs{color:var(--c-std);font-weight:700}
.cg{color:var(--c-gen);font-weight:700}
.cp{color:var(--c-point);font-weight:700}
.ct{color:var(--c-cut);font-weight:700}

/* ---------- scene & book ---------- */
#scene{position:relative;min-height:calc(100dvh - var(--tb));display:grid;place-items:center;
  padding:10px 0 calc(var(--tb) + 12px);overflow-x:hidden;overflow-x:clip;perspective:2200px;perspective-origin:50% 20%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#book{position:relative;width:calc(var(--pw)*2);height:var(--ph);transform-style:preserve-3d;transform:rotateX(var(--tilt));transition:transform .7s ease}
#book.single{width:var(--pw);--rise:-28deg}
#teach{--rise:-14deg}
#teach .cover{position:absolute;inset:calc(var(--cv)*-1);transform:translateZ(-9px);border-radius:7px;
  background:linear-gradient(135deg,var(--cover1),var(--cover2));box-shadow:0 0 0 2px rgba(0,0,0,.25) inset}
.bshadow{position:absolute;inset:calc(var(--cv)*-1);transform:translateZ(-12px) translateY(14px);background:rgba(0,0,0,.55);filter:blur(22px);border-radius:20px}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d}
.slot.R{right:0}.slot.L{left:0}
.slot.R{box-shadow:1px 1px 0 var(--stack1),2px 2px 0 var(--stack2),3px 3px 0 var(--stack1),4px 4px 0 var(--stack2),5px 5px 0 var(--stack1),6px 6px 0 rgba(0,0,0,.25)}
.slot.L{box-shadow:-1px 1px 0 var(--stack1),-2px 2px 0 var(--stack2),-3px 3px 0 var(--stack1),-4px 4px 0 var(--stack2),-5px 5px 0 var(--stack1),-6px 6px 0 rgba(0,0,0,.25)}
#book.single .slot.R{display:none}
#book.single .slot.L{box-shadow:-1px 1px 0 var(--stack1),-2px 2px 0 var(--stack2),-3px 3px 0 var(--stack1),-4px 4px 0 var(--stack2),-5px 5px 0 rgba(0,0,0,.25), 3px 0 0 var(--cover2)}
.spine{position:absolute;top:0;bottom:0;left:calc(50% - 10px);width:20px;transform:translateZ(.5px);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.16) 45%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.16) 55%,transparent)}
#book.single .spine{display:none}

/* ---------- page ---------- */
.page{position:relative;width:var(--pw);height:var(--ph);font-size:var(--fs);line-height:1.6;
  background-color:var(--paper);background-image:var(--noise);padding:1.5em 1.55em 1.1em;display:flex;flex-direction:column;transform-style:preserve-3d}

.page.sR{background-image:linear-gradient(90deg,rgba(0,0,0,.17),rgba(0,0,0,.05) 4%,transparent 9%),var(--noise)}
.page.sL{background-image:linear-gradient(270deg,rgba(0,0,0,.17),rgba(0,0,0,.05) 4%,transparent 9%),var(--noise)}
.page.text{overflow-y:auto;overflow-x:hidden;transform-style:flat;scrollbar-width:thin}
.run{display:flex;justify-content:space-between;gap:1em;font-size:.7em;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:.3em;margin-bottom:.55em;flex:none}
.pno{margin-top:auto;padding-top:.35em;text-align:center;font-size:.72em;color:var(--muted);flex:none}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:1.38em;margin:.05em 0 .45em;display:flex;align-items:center;gap:.45em}
h2 .num{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.72em;flex:none}
p{margin:.3em 0}
.tb{display:grid;grid-template-columns:minmax(0,1fr) 27%;gap:.9em;align-items:start}
.single .tb, #store .single-like .tb{grid-template-columns:minmax(0,1fr)}
.mg{border-inline-start:1.5px solid var(--margin-line);padding-inline-start:.65em;font-size:.8em;color:var(--muted);line-height:1.55}
.mg .mt{display:block;color:var(--c-point);font-weight:700;margin-bottom:.15em}
.mg p{margin:.2em 0 .55em}
.m.blk{display:block;text-align:right;white-space:normal;margin:.1em 0}
#book.single .mg{border-inline-start:0;border-top:1.5px dashed var(--margin-line);padding:.45em 0 0}
.law{font-size:1.06em;text-align:center;padding:.4em .5em;margin:.45em 0;border:1.5px solid var(--rule);border-radius:.55em;background:var(--card);overflow-x:auto;scrollbar-width:none}
.law.std{border-color:var(--c-std)} .law.gen{border-color:var(--c-gen)}
.law small{display:block;font-size:.7em;color:var(--muted);font-family:inherit}
.hook{font-size:1.02em;padding:.5em .7em;margin:.1em 0 .5em;border-radius:.5em;background:var(--paper2);border-inline-start:4px solid var(--c-cut)}
.cases{margin:.3em 0;padding:0;list-style:none;font-size:.9em}
.cases li{display:flex;gap:.4em;align-items:baseline;padding:.15em 0;border-bottom:1px dotted var(--rule)}
.cases li b{flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:.86em;margin:.35em 0}
.tbl td,.tbl th{border:1px solid var(--rule);padding:.25em .4em;text-align:start;vertical-align:middle}
.tbl th{background:var(--paper2);font-weight:700}

/* predict flap */
.predict{margin-top:.55em;border:1.5px dashed var(--muted);border-radius:.6em;padding:.45em .6em .55em;background:var(--paper2)}
.pq{font-size:.92em}
.pq b.tag{display:inline-block;background:var(--c-point);color:#fff;padding:0 .45em;border-radius:.3em;margin-inline-end:.3em;font-size:.85em}
.popts{display:flex;flex-wrap:wrap;gap:.35em;margin:.4em 0 .35em}
.flapbox{position:relative;margin-top:.2em}
.ans{padding:.45em .6em;font-size:.86em;line-height:1.6;background:var(--card);border-radius:.4em;border:1px solid var(--rule);min-height:3.4em}
.flap{position:absolute;inset:0;transform-origin:50% 0;transition:transform .7s cubic-bezier(.3,1.25,.5,1);cursor:grab;touch-action:none;z-index:2}
.flap .f{position:absolute;inset:0;border-radius:.4em;transition:opacity .4s}
.flapbox.open .flap .f{opacity:.0}
.flapbox.open .flap{background:var(--kraft2);border-radius:.4em}
.flap .f{display:grid;place-items:center;font-weight:700;font-size:.9em;color:#5a4320;
  background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(0,0,0,.035) 9px 10px),linear-gradient(180deg,var(--kraft),var(--kraft2));
  box-shadow:0 2px 3px rgba(0,0,0,.25);border:1px solid rgba(0,0,0,.12)}
:root[data-theme="dark"] .flap .f{color:#f1dfb8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flap .f{color:#f1dfb8}}
.flap .f::after{content:"";position:absolute;top:-1px;left:50%;width:2.6em;height:.5em;transform:translateX(-50%);background:rgba(0,0,0,.12);border-radius:0 0 .4em .4em}
.flapbox.open .flap{transform:perspective(700px) rotateX(102deg)}
.flap{transform:none}

/* chips */
.chip{font:inherit;font-size:.8em;line-height:1.2;padding:.32em .75em;min-height:2.15em;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;transition:background .2s}
.chip:hover{background:var(--paper2)}
.chip:active{filter:brightness(.92)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.right{background:color-mix(in srgb,var(--ok) 22%,var(--card));border-color:var(--ok)}
.chip.wrong{background:color-mix(in srgb,var(--bad) 20%,var(--card));border-color:var(--bad)}
.chip:disabled{opacity:.55;cursor:default}
.chip:focus-visible,.tbtn:focus-visible,.flap:focus-visible{outline:2px solid var(--c-radius);outline-offset:2px}

/* ---------- lab page ---------- */
.lt{font-size:1.08em;display:flex;align-items:center;gap:.4em;flex:none}
.lt .lab-ic{font-size:.7em;background:var(--c-cut);color:#fff;border-radius:.3em;padding:.05em .45em;font-weight:700}
.stage{position:relative;flex:1 1 auto;min-height:7em;margin:.25em 0 .2em;perspective:calc(var(--fs) * 55);perspective-origin:50% 0}
.page.lab{transform-style:flat}
.pop{position:absolute;inset:0;transform-style:preserve-3d}
.crease{position:absolute;left:5%;right:5%;bottom:calc(7% - 1px);height:2px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22) 15%,rgba(0,0,0,.22) 85%,transparent)}
.stage::after{content:"";position:absolute;left:4%;right:4%;bottom:1.5%;height:5.5%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(ellipse 50% 70% at 50% 0,rgba(40,25,10,.35),transparent 75%)}
.risen .stage::after{opacity:1;transition:opacity 1s .15s}
.risen .card{box-shadow:0 0 0 1px rgba(0,0,0,.10),0 -6px 18px rgba(40,25,10,.18)}
.card{position:absolute;left:7%;right:7%;top:5%;bottom:7%;transform-origin:50% 100%;transform:rotateX(0deg);
  transition:transform .28s ease-in;transform-style:preserve-3d;border-radius:3px;
  background:var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.10)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;
  background:linear-gradient(0deg,rgba(0,0,0,.13),transparent 22%),linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%)}
.card .edge{position:absolute;left:0;right:0;top:0;height:4px;background:var(--stack2);transform-origin:50% 0;transform:rotateX(90deg)}
.card canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3px}
.risen .card{transform:rotateX(var(--rise,-32deg));transition:transform 1.1s cubic-bezier(.25,1.45,.45,1)}
.risen .side{flex:none;display:flex;flex-direction:column;gap:.25em}
.ro{font-size:.84em;line-height:1.55;background:var(--paper2);border-radius:.45em;padding:.3em .55em;border:1px solid var(--rule)}
.ro .row{display:flex;flex-wrap:wrap;gap:.1em .5em;align-items:baseline}
.ro .eq{font-size:1.12em}
.ro .k{color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:.15em}
.sl{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3.3em;align-items:center;gap:.45em;font-size:.84em}
.sl .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl output{text-align:center;font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-weight:700;background:var(--card);border:1px solid var(--rule);border-radius:.35em;padding:.05em .2em}
.btns{display:flex;flex-wrap:wrap;gap:.3em;align-items:center}
.btns .lbl{font-size:.76em;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:max(1.9em,26px);background:transparent;direction:ltr;margin:0;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--graphite),var(--muted));opacity:.85}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--graphite),var(--muted))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:max(1.35em,20px);height:max(1.35em,20px);border-radius:50%;margin-top:calc((4px - max(1.35em,20px))/2);
  background:var(--cc,var(--ink));border:2.5px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:max(1.35em,20px);height:max(1.35em,20px);border-radius:50%;background:var(--cc,var(--ink));border:2.5px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.dict{width:100%;border-collapse:collapse;font-size:.85em}
.dict td{border-bottom:1px dotted var(--rule);padding:.28em .3em}
.dict td:first-child{white-space:nowrap}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-inline-end:.35em;vertical-align:middle}
.gq{font-size:.9em;font-weight:600;min-height:1.6em;flex:none;margin-top:.15em}
.gfb{min-height:2.4em}
.hide{display:none!important}

/* title page */
.tp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.25em;flex:1}
.ribbon{background:var(--c-cut);color:#fff;padding:.15em 1.2em;border-radius:999px;font-weight:700;font-size:.9em;margin-top:.4em}
.tp h1{font-size:2.1em;margin-top:.15em}
.tp .en{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--muted);direction:ltr}
.tp .lead{font-size:.92em;max-width:22em}
.toc{list-style:none;margin:.4em 0 0;padding:0;width:100%;text-align:start}
.toc button{all:unset;box-sizing:border-box;display:flex;width:100%;gap:.6em;align-items:baseline;padding:.2em .2em;border-bottom:1px dotted var(--rule);cursor:pointer;font-size:.86em}
.toc button:hover{background:var(--paper2)}
.toc button:focus-visible{outline:2px solid var(--c-radius)}
.toc .i{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.78em;flex:none}
.toc em{margin-inline-start:auto;font-style:normal;color:var(--muted);font-size:.85em;white-space:nowrap}
.howto{display:grid;gap:.25em;margin-top:.6em;font-size:.78em;color:var(--muted);text-align:start;width:100%}
.howto div::before{content:"✎ ";color:var(--c-point)}

/* game list */
.rounds{list-style:none;margin:.35em 0;padding:0;font-size:.86em}
.rounds li{display:flex;gap:.5em;align-items:center;padding:.22em 0;border-bottom:1px dotted var(--rule)}
.rounds .st{width:1.4em;text-align:center;font-weight:700;flex:none}
.rounds li.cur{font-weight:700}
.stars{font-size:1.7em;letter-spacing:.1em;text-align:center;color:#d4a017}

/* ---------- flipper ---------- */
.flip{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;transform:translateZ(2px);--sh:0}
.seg{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:flat}
.face.back{transform:rotateY(180deg)}
.face .page{position:absolute;top:0;transform-style:flat}
.face .page *{transform-style:flat!important}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 60%);opacity:var(--sh)}
.face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.3),rgba(255,255,255,.08) 70%)}
.blank{background-color:var(--paper)}

#store{position:fixed;left:-300vw;top:0;visibility:hidden;pointer-events:none}

/* ---------- toolbar ---------- */
#tb{position:fixed;left:0;right:0;bottom:0;height:var(--tb);padding:0 .5rem env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;gap:.45rem;z-index:50;
  background:rgba(25,15,8,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#f7eedd;border-top:1px solid rgba(255,255,255,.08)}
.tbtn{text-decoration:none;height:42px;min-width:42px;border-radius:21px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:0 .75rem;font:600 14px/1 inherit;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn svg{width:20px;height:20px;flex:none}
.tbtn.on{background:#f3c56b;color:#2b1b0c;border-color:#f3c56b}
.dots{display:flex;align-items:center}
.dots button{width:22px;height:34px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.35);transition:all .25s}
.dots button.on::before{width:20px;background:#f3c56b}
.sep{width:1px;height:26px;background:rgba(255,255,255,.18)}
@media (max-width:560px){ .tbtn .lbl{display:none} .tbtn{padding:0 .55rem} #tb{gap:.25rem} }
.cnt{display:none;font:600 14px/1 inherit;min-width:4.2em;text-align:center}
@media (max-width:820px){ .dots{display:none} .cnt{display:inline-block} }
.exl{list-style:none;margin:.2em 0;padding:0;display:flex;flex-direction:column;gap:.4em}
.exl li{display:flex;gap:.55em;align-items:flex-start;font-size:.92em;line-height:1.55}
.exl li>div{flex:1;min-width:0}

const MF_ATOM=/(?:<su[bp]>[^<]*<\/su[bp]>|\^[0-9a-z]|[A-Za-z0-9.πΔθεαβ′√∛])+$/;

function mfParFwd(s,j){ let d=0; for(let k=j;k<s.length;k++){ if(s[k]==='(') d++; else if(s[k]===')'){ d--; if(d===0) return k; } } return -1; }
function mfFrac(s){
  for(let i=1;i<s.length-1;i++){ if(s[i]!=='/'||s[i-1]==='<'||s[i-1]===' '||s[i+1]===' '||s[i+1]==='>') continue;
    const pre_=s.slice(0,i); if(pre_.lastIndexOf('<sup>')>pre_.lastIndexOf('</sup>')) continue;
    /* numerator */ let a, num, keepN=false; const L=s.slice(0,i);
    if(L.endsWith(')')){ const k=mfParBack(s,i-1); if(k<0) continue; a=k; num=s.slice(k+1,i-1); const pre=L.slice(0,k).match(/[A-Za-z]+$/); if(pre&&!/^(sin|cos|tan|cot|sec|csc|lim)$/.test(pre[0])){ a=k-pre[0].length; num=s.slice(a,i); keepN=true; } }
    else { const m=L.match(MF_ATOM); if(!m) continue; a=i-m[0].length; num=m[0]; keepN=true;
      const fn=s.slice(0,a).match(/(?:sin|cos|tan|cot|sec|csc)(?:\^[0-9])? $/); if(fn){ a-=fn[0].length; num=s.slice(a,i); }
      if(a>0&&s[a-1]===')'){ const k=mfParBack(s,a-1); if(k>=0){ num=s.slice(k,i); a=k; } } }

    if(R.startsWith('(')){ const k=mfParFwd(s,i+1); if(k<0) continue; b=k+1; den=s.slice(i+2,k); const ex=s.slice(b).match(/^(\^[0-9a-z]|<sup>[^<]*<\/sup>)/); if(ex){ den='('+den+')'+ex[0]; b+=ex[0].length; } }
    else { const m=R.match(MF_ATOMF); if(!m) continue; den=m[0]; b=i+1+m[0].length;
      if(/[A-Za-z]$/.test(den)&&s[b]==='('){ const k=mfParFwd(s,b); if(k>0){ den=s.slice(i+1,k+1); b=k+1; } } }
    const nTxt=num.replace(/<[^>]+>/g,''), dTxt=den.replace(/<[^>]+>/g,'');
    if(MF_UNIT_N.test(nTxt)&&MF_UNIT_D.test(dTxt)) continue; if(/^(sec|s|h|L)$/.test(dTxt)) continue;

    return s.slice(0,a)+out+mfFrac(s.slice(b)); }

function mfRadicals(s){ let out='', i=0;
  while(i<s.length){ const ch=s[i];
    if((ch==='√'||ch==='∛')){ const idx=ch==='∛'?'<span class="ri">3</span>':''; 
      if(s[i+1]==='('){ const k=mfParFwd(s,i+1); if(k>0){ out+=`<span class="rad">${idx}√<span class="rc">${mfRadicals(s.slice(i+2,k))}</span></span>`; i=k+1; continue; } }
      const m=s.slice(i+1).match(/^[A-Za-z0-9.π]+/); if(m){ out+=`<span class="rad">${idx}√<span class="rc">${m[0]}</span></span>`; i+=1+m[0].length; continue; } }

/* ================= pencil drawing ================= */
const COL={};
function readCols(){ const cs=getComputedStyle(document.documentElement); ['graphite','muted','grid','c-center','c-radius','c-std','c-gen','c-point','c-cut','paper','card','ok','bad','ink'].forEach(k=>COL[k]=cs.getPropertyValue('--'+k).trim()); }
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function noise(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return (hash(i)*(1-u)+hash(i+1)*u)*2-1; }
class Pen{
  constructor(c){this.c=c;}
  path(pts,o={}){
    const c=this.c, passes=o.passes||2, J=o.j??0.8;
    c.save(); c.lineCap='round'; c.lineJoin='round'; c.strokeStyle=o.color||COL.graphite; if(o.dash) c.setLineDash(o.dash);
    for(let p=0;p<passes;p++){
      c.globalAlpha=(o.a??0.9)*(p?0.45:1); c.lineWidth=(o.w||1.3)*(p?0.65:1); c.beginPath();
      pts.forEach(([x,y],i)=>{ const ox=noise(x*.05+y*.021+p*37.1)*J, oy=noise(y*.05-x*.017+p*19.7)*J; i?c.lineTo(x+ox,y+oy):c.moveTo(x+ox,y+oy); });
      c.stroke();
    }
    c.restore();
  }
  line(x1,y1,x2,y2,o={}){
    const d=Math.hypot(x2-x1,y2-y1)||1, n=Math.max(2,Math.ceil(d/7)), ex=o.over??1.5, ux=(x2-x1)/d, uy=(y2-y1)/d, pts=[];
    for(let i=0;i<=n;i++){const t=i/n; pts.push([x1-ux*ex+(x2-x1+2*ux*ex)*t, y1-uy*ex+(y2-y1+2*uy*ex)*t]);}
    this.path(pts,o);
  }
  circle(cx,cy,R,o={}){
    const n=Math.max(32,Math.ceil(R*.6)), a0=noise(cx*.1+cy*.07)*3, pts=[];
    for(let i=0;i<=n*1.04;i++){const a=a0+i/n*Math.PI*2, rr=R+noise(i*.31+cx*.01)*.7; pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
    this.path(pts,o);
  }
  hatch(clip,col,sp=6,alpha=.32){
    const c=this.c; c.save(); c.beginPath(); clip(c); c.clip(); c.strokeStyle=col; c.globalAlpha=alpha; c.lineWidth=1; c.beginPath();
    for(let s=-this.H;s<this.W+this.H;s+=sp){ c.moveTo(s,0); c.lineTo(s-this.H*.75,this.H); }
    c.stroke(); c.restore();
  }
  dot(x,y,r,col){ const c=this.c; c.save(); c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.restore(); this.circle(x,y,r+.6,{color:COL.graphite,w:.8,a:.6,passes:1}); }
  text(s,x,y,o={}){
    const c=this.c; c.save(); c.font=`${o.it===false?'':'italic '}${o.wt||600} ${o.size||13}px "Cambria Math",Cambria,"Times New Roman",serif`;
    if(o.ar) c.font=`${o.wt||700} ${o.size||13}px "Segoe UI","Noto Sans Arabic",Tahoma,sans-serif`;
    c.direction=o.ar?'rtl':'ltr'; c.textAlign=o.al||'center'; c.textBaseline=o.bl||'middle';
    if(o.halo!==false){ c.lineWidth=3.2; c.strokeStyle=COL.card; c.globalAlpha=.9; c.strokeText(s,x,y); c.globalAlpha=1; }
    c.fillStyle=o.color||COL.graphite; c.fillText(s,x,y); c.restore();
  }
  arrowHead(x,y,ang,o={}){ const L=o.L||7; this.line(x,y,x-L*Math.cos(ang-.45),y-L*Math.sin(ang-.45),{...o,over:0}); this.line(x,y,x-L*Math.cos(ang+.45),y-L*Math.sin(ang+.45),{...o,over:0}); }
}
function coordPlane(pen,W,H,R){
  const pad=6, s=Math.min(W-2*pad,H-2*pad)/(2*R), ox=W/2, oy=H/2, X=x=>ox+x*s, Y=y=>oy-y*s, c=pen.c;
  const step=s<11?5:s<17?2:1;
  c.save(); c.strokeStyle=COL.grid; c.lineWidth=1; c.beginPath();
  const xm=Math.ceil(W/2/s), ym=Math.ceil(H/2/s);
  for(let i=-xm;i<=xm;i++){ if(step>1&&i%step) continue; c.moveTo(X(i),0); c.lineTo(X(i),H); }
  for(let j=-ym;j<=ym;j++){ if(step>1&&j%step) continue; c.moveTo(0,Y(j)); c.lineTo(W,Y(j)); }
  c.stroke(); c.restore();
  pen.line(5,oy,W-5,oy,{w:1.25,a:.85}); pen.line(ox,H-5,ox,5,{w:1.25,a:.85});
  pen.arrowHead(W-5,oy,0,{w:1.2}); pen.arrowHead(ox,5,-Math.PI/2,{w:1.2});
  const fs=Math.max(9,Math.min(13,s*.5+3));
  pen.text('X',W-10,oy-fs*.95,{size:fs+2,wt:700}); pen.text('Y',ox+fs*.85,10,{size:fs+2,wt:700});
  let ts=step; while(ts*s<fs*2.1) ts=ts===1?2:ts===2?5:ts*2;
  for(let i=-xm;i<=xm;i++){ if(!i||i%ts) continue; const x=X(i); if(x<14||x>W-22) continue; pen.line(x,oy-2.5,x,oy+2.5,{w:1,passes:1,over:0}); pen.text(fmt(i),x,oy+fs*.9,{size:fs,it:false,wt:500,color:COL.muted}); }
  for(let j=-ym;j<=ym;j++){ if(!j||j%ts) continue; const y=Y(j); if(y<20||y>H-10) continue; pen.line(ox-2.5,y,ox+2.5,y,{w:1,passes:1,over:0}); pen.text(fmt(j),ox-4,y,{size:fs,it:false,wt:500,color:COL.muted,al:'right'}); }
  return {X,Y,s,fs};
}

/* pre-stretch drawings vertically so that, after the pop-up card leans and the book tilts, circles still look round */
function AK(page){ const inT=!!(page&&page.closest('#teach')); const r=inT?14:(single?28:32), t=inT?9:(single?7:18); return 1/(Math.cos(r*Math.PI/180)*Math.cos(t*Math.PI/180)); }
const LABS=[];
class Lab{
  constructor(page){
    this.page=page; this.cv=$('canvas',page); this.c=this.cv.getContext('2d'); this.pen=new Pen(this.c);
    this.cur={}; this.tgt={}; this.W=0; this.H=0; this.d=1;
    new ResizeObserver(()=>this.fit()).observe(this.cv);
    $$('input[type=range]',page).forEach(inp=>inp.addEventListener('input',()=>{ this.hideEx(); this.onSlide(inp.dataset.k,parseFloat(inp.value)); }));
    page.addEventListener('click',e=>{ const b=e.target.closest('[data-q]'); if(b) this.showEx(b.dataset.q); });
    LABS.push(this);
  }
  fit(){ const w=this.cv.clientWidth,h=this.cv.clientHeight; if(!w||!h) return; const d=Math.min(3,(devicePixelRatio||1)*1.5), K=AK(this.page);
    this.cv.width=Math.round(w*d); this.cv.height=Math.round(h*d); this.d=d; this.K=K; this.W=w; this.H=h/K; this.pen.W=w; this.pen.H=this.H; this.draw(); }
  setVal(k,v,label){ const inp=$(`input[data-k="${k}"]`,this.page); if(inp) inp.value=v; const o=$(`output[data-o="${k}"]`,this.page); if(o) o.innerHTML=`<bdi dir="ltr">${label??fmt(v)}</bdi>`; }
  set(o){ Object.assign(this.tgt,o); for(const k in o) if(this.cur[k]===undefined) this.cur[k]=o[k]; this.ui(); this.kick(); }
  kick(){ if(!this.raf) this.raf=requestAnimationFrame(()=>this.tick()); }
  tick(){ this.raf=0; let mv=false;
    for(const k in this.tgt){ const a=this.cur[k], b=this.tgt[k]; if(RM){this.cur[k]=b;continue;} const n=a+(b-a)*.2; if(Math.abs(b-n)<1e-3) this.cur[k]=b; else {this.cur[k]=n; mv=true;} }
    if(this.W) this.draw(); if(mv||this.anim) this.kick(); }
  clear(){ const c=this.c; c.setTransform(this.d,0,0,this.d*this.K,0,0); c.clearRect(0,0,this.W,this.H); c.fillStyle=COL.card; c.fillRect(0,0,this.W,this.H); }
  ro(html){ $('.ro',this.page).innerHTML=html; }
  showEx(key){ const q=EXQ[key], el=$('.exq',this.page); if(!q||!el) return; el.innerHTML=`<b>${q[0]}</b>${q[1]}`; el.classList.remove('hide'); }
  hideEx(){ const el=$('.exq',this.page); if(el) el.classList.add('hide'); }
  onSlide(){} ui(){} draw(){}
}

/* ================= helpers (chapter 6) ================= */
const isInt=v=>Math.abs(v-Math.round(v))<1e-9;
const row=h=>`<div class="row">${h}</div>`;
const ok=h=>`<b style="color:var(--ok)">✓ ${h}</b>`, bad=h=>`<b style="color:var(--bad)">✗ ${h}</b>`;
function dec(v,n=4){ if(!isFinite(v)) return 'غير معرّفة'; if(Math.abs(v)<5e-12) v=0; let s=v.toFixed(n); if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,''); if(s==='-0') s='0'; return s.replace('-','−'); }
function frac(v,n=4){ if(!isFinite(v)) return '—'; for(let d=1;d<=12;d++){ const k=Math.round(v*d); if(Math.abs(k/d-v)<1e-9){ const s=k<0?'−':''; return d===1?s+Math.abs(k):s+Math.abs(k)+'/'+d; } } return dec(v,n); }
const gcd=(a,b)=>{ a=Math.abs(Math.round(a)); b=Math.abs(Math.round(b)); while(b){ [a,b]=[b,a%b]; } return a; };
function niceStep(range,px,minPx=34){ const c=[0.05,0.1,0.2,0.25,0.5,1,2,5,10,20,25,50,100,200,500]; for(const s of c){ if(px*s/range>=minPx) return s; } return 1000; }
/* axes inside a region of the card. o.top/o.bot: fraction of height; o.eq: equal units (y-range derived from yc) */
function axesN(lab,x0,x1,y0,y1,o={}){ const {pen,W,H}=lab, c=pen.c, pl=30, pr=12, T=(o.top||0)*H+12, B=(o.bot??1)*H-20;
  if(o.eq){ const span=(x1-x0)*(B-T)/(W-pl-pr), yc=(y0+y1)/2; y0=yc-span/2; y1=yc+span/2; }
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>T+(y1-y)/(y1-y0)*(B-T);
  const sx=niceStep(x1-x0,W-pl-pr), sy=niceStep(y1-y0,B-T,24);
  c.save(); c.strokeStyle=COL.grid; c.lineWidth=1; c.beginPath();
  for(let g=Math.ceil(x0/sx)*sx;g<=x1+1e-9;g+=sx){ c.moveTo(X(g),T); c.lineTo(X(g),B); }
  for(let g=Math.ceil(y0/sy)*sy;g<=y1+1e-9;g+=sy){ c.moveTo(pl,Y(g)); c.lineTo(W-pr,Y(g)); } c.stroke(); c.restore();
  const yA=Math.min(Math.max(0,y0),y1), xA=Math.min(Math.max(0,x0),x1);
  pen.line(pl-4,Y(yA),W-pr,Y(yA),{w:1.3}); pen.arrowHead(W-pr,Y(yA),0,{w:1.2}); pen.line(X(xA),B+4,X(xA),T-2,{w:1.3}); pen.arrowHead(X(xA),T-2,-Math.PI/2,{w:1.2});
  const fs=10.5;
  for(let g=Math.ceil(x0/sx)*sx;g<=x1+1e-9;g+=sx){ if(Math.abs(g)<1e-9) continue; const x=X(g); if(x>W-pr-8) continue; pen.text(fmt(g),x,Math.min(B+12,Y(yA)+fs+2),{size:fs,it:false,wt:500,color:COL.muted}); }
  for(let g=Math.ceil(y0/sy)*sy;g<=y1+1e-9;g+=sy){ if(Math.abs(g)<1e-9) continue; const y=Y(g); if(y<T+4||y>B-4) continue; pen.text(fmt(g),Math.max(pl-2,X(xA)-5),y,{size:fs,it:false,wt:500,color:COL.muted,al:'right'}); }
  if(o.yl) pen.text(o.yl,X(xA)+8,T+6,{size:12,wt:700,color:o.ylc||COL.graphite,al:'left'});
  return {X,Y,x0,x1,y0,y1,T,B}; }
function plotN(lab,G,f,a,b,o={}){ const {pen}=lab, n=o.n||500, y0=G.y0, y1=G.y1; let seg=[], prev=null;
  const flush=()=>{ if(seg.length>1) pen.path(seg,{color:o.color||COL['c-point'],w:o.w||2.2,dash:o.dash,a:o.a??.95,passes:o.passes}); seg=[]; };
  for(let i=0;i<=n;i++){ const x=a+(b-a)*i/n, y=f(x); if(!isFinite(y)||y>y1+(y1-y0)||y<y0-(y1-y0)){ flush(); prev=null; continue; }
    if(prev!==null&&Math.abs(y-prev)>(y1-y0)*.5){ flush(); } seg.push([G.X(x),G.Y(Math.max(y0-.02*(y1-y0),Math.min(y1+.02*(y1-y0),y)))]); prev=y; }
  flush(); }
function hole(lab,G,x,y,col){ const {pen,c}=lab; const X=G.X(x), Y=G.Y(y); c.save(); c.fillStyle=COL.card; c.beginPath(); c.arc(X,Y,4.6,0,7); c.fill(); c.restore(); pen.circle(X,Y,4.6,{color:col||COL['c-point'],w:1.8,passes:1,a:1}); }
/* straight line of slope m through (x1,y1), clipped to the panel */
function lineM(lab,G,m,x1,y1,o={}){ const c=lab.c; c.save(); c.beginPath(); c.rect(G.X(G.x0),G.T,G.X(G.x1)-G.X(G.x0),G.B-G.T); c.clip();
  if(!isFinite(m)) lab.pen.line(G.X(x1),G.T,G.X(x1),G.B,{color:o.color||COL['c-radius'],w:o.w||1.8,dash:o.dash,passes:1});
  else lab.pen.line(G.X(G.x0),G.Y(y1+m*(G.x0-x1)),G.X(G.x1),G.Y(y1+m*(G.x1-x1)),{color:o.color||COL['c-radius'],w:o.w||1.8,dash:o.dash,passes:o.passes||1});
  c.restore(); }
/* implicit curve F(x,y)=0 by marching squares (plain strokes) */
function implicitN(lab,G,F,o={}){ const c=lab.c, nx=o.nx||160, ny=o.ny||120, dx=(G.x1-G.x0)/nx, dy=(G.y1-G.y0)/ny, v=[];
  for(let j=0;j<=ny;j++){ v[j]=[]; for(let i=0;i<=nx;i++) v[j][i]=F(G.x0+i*dx,G.y0+j*dy); }
  c.save(); c.strokeStyle=o.color||COL['c-point']; c.lineWidth=o.w||2.2; c.lineCap='round'; c.globalAlpha=.9; c.beginPath();
  const P=(i,j)=>[G.X(G.x0+i*dx),G.Y(G.y0+j*dy)], L=(a,b,va,vb)=>{ const t=va/(va-vb); return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]; };
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const q=[[i,j],[i+1,j],[i+1,j+1],[i,j+1]], vals=q.map(([a,b])=>v[b][a]); if(vals.some(z=>!isFinite(z))) continue; const pts=[];
    for(let k=0;k<4;k++){ const a=vals[k], b=vals[(k+1)%4]; if((a<0)!==(b<0)) pts.push(L(P(...q[k]),P(...q[(k+1)%4]),a,b)); }
    if(pts.length>=2){ c.moveTo(...pts[0]); c.lineTo(...pts[1]); } if(pts.length===4){ c.moveTo(...pts[2]); c.lineTo(...pts[3]); } }
  c.stroke(); c.restore(); }
/* graph spec: {x0,x1,y0,y1,eq,P:[{f,a,b,col,dash}],I:[{F,col}],O,C,G:[[x,y,label,col]],L:[[m,x1,y1,col,dash]],V:[x]} */
function drawG(lab,S,o={}){ const G=axesN(lab,S.x0,S.x1,S.y0,S.y1,{eq:S.eq,...o}), pen=lab.pen;
  (S.V||[]).forEach(x=>pen.line(G.X(x),G.T,G.X(x),G.B,{color:COL.muted,w:1,dash:[5,5],passes:1,a:.7}));
  (S.P||[]).forEach(p=>plotN(lab,G,p.f,Math.max(G.x0,p.a??G.x0),Math.min(G.x1,p.b??G.x1),{color:COL[p.col||'c-point'],dash:p.dash,w:p.w}));
  (S.I||[]).forEach(p=>implicitN(lab,G,p.F,{color:COL[p.col||'c-point']}));
  (S.L||[]).forEach(([m,x,y,col,dash])=>lineM(lab,G,m,x,y,{color:COL[col||'c-radius'],dash:dash?[6,4]:undefined}));
  (S.G||[]).forEach(([x,y,l,col])=>{ const cc=COL[col||'c-center']; if(l) pen.text(l,G.X(x)+10,G.Y(y)-12,{color:cc,size:12,wt:700,al:'left'}); pen.dot(G.X(x),G.Y(y),4.2,cc); });
  (S.O||[]).forEach(([x,y])=>hole(lab,G,x,y));
  (S.C||[]).forEach(([x,y])=>pen.dot(G.X(x),G.Y(y),4.3,COL['c-point']));
  return G; }
function qMark(lab){ const {pen,W,H}=lab; pen.text('؟',W/2,H/2,{ar:true,size:Math.min(W,H)*.32,color:COL.muted,halo:false}); }
const nd=(f,x,h=1e-5)=>(f(x+h)-f(x-h))/(2*h);
/* line through (x1,y1) with slope m written as Ax + By + C = 0 with integer coefficients when possible */
function lineEq(m,x1,y1){ let A,B,C;
  if(!isFinite(m)){ A=1; B=0; C=-x1; } else { A=m; B=-1; C=y1-m*x1; }
  for(let d=1;d<=60;d++){ if([A,B,C].every(v=>isInt(v*d))){ A*=d; B*=d; C*=d; const g=gcd(gcd(A,B),C)||1; A/=g; B/=g; C/=g; break; } }
  if(A<0||(Math.abs(A)<1e-12&&B<0)){ A=-A; B=-B; C=-C; }
  const t=(k,v,first)=>{ if(Math.abs(k)<1e-12) return ''; const s=k<0?'−':'+', a=Math.abs(k), n=v&&Math.abs(a-1)<1e-12?'':dec(a,3); return first?(k<0?'−':'')+n+v:` ${s} ${n}${v}`; };
  let s=t(A,'x',true); s+=s?t(B,'y',false):t(B,'y',true); s+=t(C,'',false); return (s||'0')+' = 0'; }

    if(fin){ const sc=this.res.filter(Boolean).length, st=this.stars(); $('.gq',p).innerHTML=`نتيجتك ${N(sc+' / '+ROUNDS6.length)}`; this.ro(st===3?'ممتاز! أتقنت المشتقات.':st===2?'جيد جداً. راجع الأسئلة التي أخطأت فيها.':'راجع قواعد المشتقة وقاعدة السلسلة ثم أعد التحدّي.'); }

    this.side(); this.kick(); }
  side(){ if(!this.list) return; this.list.innerHTML=ROUNDS6.map((R,j)=>`<li class="${j===this.i?'cur':''}"><span class="st" style="color:${this.res[j]===true?'var(--ok)':this.res[j]===false?'var(--bad)':'var(--muted)'}">${this.res[j]===true?'✓':this.res[j]===false?'✗':N(j+1)}</span><span>${R.q}</span></li>`).join('');
    const st=this.stars(), fin=this.i>=ROUNDS6.length; this.starEl.innerHTML=fin?'★'.repeat(st)+'<span style="opacity:.25">'+'★'.repeat(3-st)+'</span>':''; }
  choose(j){ if(this.done) return; const R=ROUNDS6[this.i], okk=j===R.a; this.done=true; this.res[this.i]=okk;
    $$('.gopts .chip',this.page).forEach((x,q)=>{ x.disabled=true; if(q===R.a) x.classList.add('right'); else if(q===j) x.classList.add('wrong'); });
    this.ro(`${okk?'<b style="color:var(--ok)">✓ صحيح!</b>':'<b style="color:var(--bad)">✗ ليس تماماً.</b>'} ${R.why}`); $('.gnext',this.page).classList.remove('hide'); this.side(); this.kick(); }
  draw(){ if(!this.W) return; this.clear(); const {W,H,pen}=this;
    if(this.i>=ROUNDS6.length){ const st=this.stars(), cx=W/2, cy=H/2, R0=Math.min(W/7,H/3);
      for(let j=0;j<3;j++){ const x=cx+(j-1)*R0*2.2, y=cy+(j===1?-R0*.25:R0*.1), pts=[]; for(let q=0;q<=10;q++){ const a=-Math.PI/2+q*Math.PI/5, rr=q%2?R0*.45:R0; pts.push([x+rr*Math.cos(a),y+rr*Math.sin(a)]); }
        if(j<st) pen.hatch(c=>{ pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); },'#d4a017',3.5,.85); pen.path(pts,{w:2,a:j<st?.95:.35}); } return; }
    const R=ROUNDS6[this.i];
    if(!R.g){ qMark(this); if(this.done) pen.text('✓',W*.8,H*.25,{size:40,color:COL.ok,halo:false,it:false}); return; }
    if(this.done) drawG(this,R.g); else { axesN(this,R.g.x0,R.g.x1,R.g.y0,R.g.y1,{eq:R.g.eq}); qMark(this); } }
}

/* ================= build pages ================= */
const store=$('#store'), book=$('#book'), slotL=$('.slot.L',book), slotR=$('.slot.R',book);
const SP=PAGES.map(([r,l])=>{ const t=document.createElement('div'); t.innerHTML=r.trim(); const R=t.firstElementChild; t.innerHTML=l.trim(); const L=t.firstElementChild; store.append(R,L); return {R,L}; });
readCols();
const LABMAP={intro:IntroLab,sec:SecLab,motion:MotionLab,diff:DiffLab,dl:DLab,chain:ChainLab,tan6:Tan6Lab,imp:ImpLab,chk6:Chk6Lab,game:GameLab};
SP.forEach(sp=>{ const L=new LABMAP[sp.L.dataset.lab](sp.L); sp.lab=L; });
const GSP=SP.find(sp=>sp.L.dataset.lab==='game'); const game=GSP.lab; game.list=$('.rounds',GSP.R); game.starEl=$('.stars',GSP.R); game.side();
/* numbering, lab headers and table of contents are generated so they always match the page order */
SP.forEach((sp,i)=>{ $('.pno',sp.R).innerHTML=N(2*i+1); $('.pno',sp.L).innerHTML=N(2*i+2);
  if(i){ const nm=$('h2 .num',sp.R); if(nm) nm.textContent=i; const rs=$('.run span',sp.L); if(rs) rs.textContent='مختبر '+i; } });
$('.toc',SP[0].R).innerHTML=SP.slice(1).map((sp,j)=>{ const h=$('h2',sp.R).cloneNode(true); h.querySelector('.num')?.remove(); const pg=$('.run span:last-child',sp.R).innerHTML.split('·').pop();
  return `<li><button type="button" data-go="${j+1}"><span class="i">${j+1}</span><span>${h.textContent.trim()}</span><em>${pg.includes('ص')?pg:''}</em></button></li>`; }).join('');

/* paper flaps (predict boxes and exercise answers) */
function setupFlap(box,onState){
  const flap=$('.flap',box); let sy=null, moved=false, h=1;
  let tOpen=0;
  const setOpen=o=>{ tOpen=Date.now(); flap.style.transform=''; box.classList.toggle('open',o); flap.setAttribute('aria-label',o?'أنزل اللسان':'ارفع اللسان لكشف الإجابة'); onState&&onState(o); };
  flap.addEventListener('pointerdown',e=>{ e.stopPropagation(); sy=e.clientY; moved=false; h=flap.offsetHeight||40; flap.setPointerCapture(e.pointerId); flap.style.transition='none'; });
  flap.addEventListener('pointermove',e=>{ if(sy===null) return; const dy=sy-e.clientY; if(Math.abs(dy)>4) moved=true; const base=box.classList.contains('open')?102:0; const a=Math.max(0,Math.min(110,base+dy/h*90)); flap.style.transform=`perspective(700px) rotateX(${a}deg)`; });
  const up=e=>{ if(sy===null) return; const dy=sy-e.clientY; sy=null; flap.style.transition='';
    const open=box.classList.contains('open'); if(!moved) setOpen(!open); else setOpen(open?dy>-h*.4:dy>h*.35); };
  flap.addEventListener('pointerup',up); flap.addEventListener('pointercancel',up);
  flap.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setOpen(!box.classList.contains('open')); } });
  /* on touch screens the tap that opens the flap is followed by a click on the answer underneath: ignore it */
  $('.ans',box).addEventListener('click',()=>{ if(box.classList.contains('open')&&Date.now()-tOpen>600) setOpen(false); });
  flap.addEventListener('click',e=>e.stopPropagation());
}
$$('.predict').forEach(pd=>{
  const ans=+pd.dataset.ans, box=$('.flapbox',pd), opts=$$('.popts .chip',pd); let picked=null;
  const mark=()=>{ if(!box.classList.contains('open')) return; opts.forEach((b,i)=>{ b.classList.toggle('right',i===ans); b.classList.toggle('wrong',i===picked&&i!==ans); }); };
  opts.forEach((b,i)=>b.onclick=()=>{ picked=i; opts.forEach(x=>x.classList.toggle('on',x===b)); mark(); });
  setupFlap(box,o=>{ if(o) mark(); else opts.forEach(b=>b.classList.remove('right','wrong')); });
});
$$('.flapbox.mini').forEach(b=>setupFlap(b));
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>goSpread(+b.dataset.go)));

/* ================= layout ================= */
let single=false, pos=0; /* pos = spread index */
let sub=0; /* in single mode: 0=text page,1=lab page */
function layout(){
  const W=innerWidth, Hs=innerHeight, TB=60, H=Hs-TB-20;
  const was=single; single = (W/H<1.12) || W<640;
  let pw,ph,fs;
  if(!single){ ph=Math.min(H*.93,((W-40)/2)/.74); ph=Math.max(ph,11*42); pw=ph*.74; fs=ph/42; }
  else { pw=Math.min(W-28,H*.95*.8); ph=Math.min(H*.95,pw/.5); ph=Math.max(ph,560); pw=Math.min(pw,ph*.8); fs=Math.max(11.5,Math.min(ph/49,pw/26.5)); }
  const rs=document.documentElement.style;
  rs.setProperty('--pw',pw.toFixed(1)+'px'); rs.setProperty('--ph',ph.toFixed(1)+'px'); rs.setProperty('--fs',fs.toFixed(2)+'px');
  rs.setProperty('--cv',Math.max(7,ph*.02).toFixed(1)+'px'); rs.setProperty('--tilt',single?'7deg':'18deg');
  book.classList.toggle('single',single);
  if(was!==single||!book.dataset.ready){ book.dataset.ready=1; place(); LABS.forEach(l=>l.fit()); }
}
function sideOf(pg,s){ pg.classList.remove('sR','sL'); pg.classList.add(s); }
function place(){
  SP.forEach(sp=>{ if(sp.R.parentNode!==store) store.append(sp.R); if(sp.L.parentNode!==store) store.append(sp.L); sp.L.classList.remove('risen'); });
  const sp=SP[pos];
  if(!single){ sideOf(sp.R,'sR'); sideOf(sp.L,'sL'); slotR.replaceChildren(sp.R); slotL.replaceChildren(sp.L); }
  else { const pg=sub?sp.L:sp.R; sideOf(pg,'sL'); slotL.replaceChildren(pg); slotR.replaceChildren(); }
  nav(); riseSoon();
}
function visibleLabs(){ return $$('.page.lab',book); }
function riseSoon(){ setTimeout(()=>{ visibleLabs().forEach(p=>p.classList.add('risen')); SP[0].lab[slotHas(SP[0].L)?'start':'stop'](); },60); }
function slotHas(pg){ return pg.parentNode===slotL||pg.parentNode===slotR; }

/* ================= navigation & flip ================= */
const dotsEl=$('#dots');
SP.forEach((_,i)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label',i?`الفصل ${i}`:'الغلاف والقاموس'); b.onclick=()=>goSpread(i); dotsEl.append(b); });
function nav(){
  $$('button',dotsEl).forEach((b,i)=>b.classList.toggle('on',i===pos)); $('#cnt').innerHTML=N(`${pos+1} / ${SP.length}`);
  const atStart=pos===0&&(!single||sub===0), atEnd=pos===SP.length-1&&(!single||sub===1);
  $('#bPrev').disabled=atStart; $('#bNext').disabled=atEnd;
  try{ localStorage.setItem('lb-ch6-pos',JSON.stringify({pos,sub,total:SP.length})); }catch(e){}
}
let busy=false;
function snap(pg,off){
  const c=pg.cloneNode(true); c.classList.remove('risen'); c.style.left=off+'px';
  const a=$$('canvas',pg), b=$$('canvas',c); a.forEach((cv,i)=>{ b[i].width=cv.width; b[i].height=cv.height; try{ b[i].getContext('2d').drawImage(cv,0,0); }catch(e){} });
  const ia=$$('input',pg), ib=$$('input',c); ia.forEach((x,i)=>ib[i].value=x.value);
  return c;
}
function blank(off){ const d=document.createElement('div'); d.className='page blank'; d.style.left=off+'px'; return d; }
function face(cls,content){ const f=document.createElement('div'); f.className='face '+cls; f.append(content); return f; }
function mkSeg(left,origin,fr,bk){ const s=document.createElement('div'); s.className='seg'; s.style.left=left; s.style.width='50%'; s.style.transformOrigin=origin; s.append(face('front',fr),face('back',bk)); return s; }
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function animate(seg1,seg2,th0,th1,bendSign,wrap){
  return new Promise(res=>{
    const dur=RM?1:820, t0=performance.now();
    const fr=now=>{ const t=Math.min(1,(now-t0)/dur), e=ease(t), th=th0+(th1-th0)*e, b=bendSign*34*Math.sin(Math.PI*e);
      seg1.style.transform=`rotateY(${th}deg)`; seg2.style.transform=`rotateY(${b}deg)`; wrap.style.setProperty('--sh',(Math.sin(Math.PI*e)*.9).toFixed(3));
      if(t<1) requestAnimationFrame(fr); else res(); };
    requestAnimationFrame(fr);
  });
}
async function flip(dir,target){ /* dir 1 = forward, -1 = back; target = {pos,sub} */
  if(busy) return; busy=true; sound();
  const labs=visibleLabs(); if(labs.some(p=>p.classList.contains('risen'))){ labs.forEach(p=>p.classList.remove('risen')); await wait(RM?0:240); }
  const pw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'));
  const wrap=document.createElement('div'); wrap.className='flip';
  const cur=SP[pos], nx=SP[target.pos];
  let seg1,seg2,th0,th1,bs,finish;
  if(!single){
    if(dir>0){
      const f1=snap(cur.L,-pw/2), f2=snap(cur.L,0); sideOf(nx.R,'sR'); sideOf(nx.L,'sL'); const b1=snap(nx.R,0), b2=snap(nx.R,-pw/2);
      seg1=mkSeg(`${pw/2}px`,'100% 50%',f1,b1); seg2=mkSeg('-100%','100% 50%',f2,b2); seg1.style.width=pw/2+'px'; seg2.style.width='100%';
      slotL.replaceChildren(nx.L); th0=0; th1=180; bs=1; finish=()=>slotR.replaceChildren(nx.R);
    } else {
      const f1=snap(cur.R,0), f2=snap(cur.R,-pw/2); sideOf(nx.R,'sR'); sideOf(nx.L,'sL'); const b1=snap(nx.L,-pw/2), b2=snap(nx.L,0);
      seg1=mkSeg(`${pw}px`,'0% 50%',f1,b1); seg2=mkSeg('100%','0% 50%',f2,b2); seg1.style.width=pw/2+'px'; seg2.style.width='100%';
      slotR.replaceChildren(nx.R); th0=0; th1=-180; bs=-1; finish=()=>slotL.replaceChildren(nx.L);
    }
  } else {
    const curPg=sub?cur.L:cur.R, nxPg=target.sub?nx.L:nx.R; sideOf(nxPg,'sL');
    if(dir>0){ seg1=mkSeg(`${pw/2}px`,'100% 50%',snap(curPg,-pw/2),blank(0)); seg2=mkSeg('-100%','100% 50%',snap(curPg,0),blank(-pw/2));
      slotL.replaceChildren(nxPg); th0=0; th1=180; bs=1; finish=()=>{}; }
    else { seg1=mkSeg(`${pw/2}px`,'100% 50%',snap(nxPg,-pw/2),blank(0)); seg2=mkSeg('-100%','100% 50%',snap(nxPg,0),blank(-pw/2));
      th0=180; th1=0; bs=1; finish=()=>slotL.replaceChildren(nxPg); }
    seg1.style.width=pw/2+'px'; seg2.style.width='100%';
  }
  seg1.style.transform=`rotateY(${th0}deg)`; seg1.querySelector('.face.back').after(seg2);
  wrap.append(seg1); book.append(wrap);
  SP.forEach(sp=>{ [sp.R,sp.L].forEach(pg=>{ if(!slotHas(pg)&&pg.parentNode!==store) store.append(pg); }); });
  await animate(seg1,seg2,th0,th1,bs,wrap);
  finish(); wrap.remove();
  SP.forEach(sp=>{ [sp.R,sp.L].forEach(pg=>{ if(!slotHas(pg)) store.append(pg); }); });
  pos=target.pos; sub=target.sub; nav(); riseSoon(); busy=false;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function next(){ if(teachOn) return teachMove(1); if(!single){ if(pos<SP.length-1) flip(1,{pos:pos+1,sub:0}); } else { if(sub===0) flip(1,{pos,sub:1}); else if(pos<SP.length-1) flip(1,{pos:pos+1,sub:0}); } }
function prev(){ if(teachOn) return teachMove(-1); if(!single){ if(pos>0) flip(-1,{pos:pos-1,sub:0}); } else { if(sub===1) flip(-1,{pos,sub:0}); else if(pos>0) flip(-1,{pos:pos-1,sub:1}); } }
function goSpread(i){ if(teachOn){ pos=i; teachShow(); return; } if(i===pos&&(!single||sub===0)) return; flip(i>pos||(i===pos)?1:-1,{pos:i,sub:0}); }
$('#bNext').onclick=next; $('#bPrev').onclick=prev;
addEventListener('keydown',e=>{ if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowLeft'||e.key==='PageDown'){ e.preventDefault(); next(); } else if(e.key==='ArrowRight'||e.key==='PageUp'){ e.preventDefault(); prev(); } else if(e.key==='Escape'&&teachOn) teachExit(); });
/* swipe */
let sw=null;
const swEnd=(x,y)=>{ if(!sw) return; const dx=x-sw.x, dy=y-sw.y; sw=null; if(Math.abs(dx)>45&&Math.abs(dx)>1.3*Math.abs(dy)){ dx>0?next():prev(); } };
const swOk=t=>!t.closest('input,button,.flap,a,.toc');
$('#scene').addEventListener('pointerdown',e=>{ if(e.pointerType==='touch'||!swOk(e.target)) return; sw={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup',e=>{ if(e.pointerType!=='touch') swEnd(e.clientX,e.clientY); });
$('#scene').addEventListener('touchstart',e=>{ if(e.touches.length!==1||!swOk(e.target)){ sw=null; return; } sw={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
$('#scene').addEventListener('touchend',e=>{ const t=e.changedTouches[0]; if(t) swEnd(t.clientX,t.clientY); },{passive:true});
$('#scene').addEventListener('touchcancel',()=>sw=null);

/* ================= sound ================= */
let muted=false, actx=null;
try{ muted=localStorage.getItem('lb-mute')==='1'; }catch(e){}
function muteUI(){ const b=$('#bMute'); b.setAttribute('aria-pressed',muted); b.setAttribute('aria-label',muted?'تشغيل الصوت':'كتم الصوت'); $('.w',b).style.display=muted?'none':''; $('.x',b).style.display=muted?'':'none'; }
$('#bMute').onclick=()=>{ muted=!muted; try{localStorage.setItem('lb-mute',muted?'1':'0');}catch(e){} muteUI(); };
muteUI();
function sound(){ if(muted) return; try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
  const t=actx.currentTime, len=.42, sr=actx.sampleRate, buf=actx.createBuffer(1,Math.floor(sr*len),sr), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const x=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-x,1.6)*(0.6+0.4*Math.sin(x*40)); }
  const src=actx.createBufferSource(); src.buffer=buf; const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.7;
  bp.frequency.setValueAtTime(700,t); bp.frequency.exponentialRampToValueAtTime(3200,t+.3);
  const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.06); g.gain.exponentialRampToValueAtTime(.001,t+len);
  src.connect(bp).connect(g).connect(actx.destination); src.start(t);
}catch(e){} }

/* ================= theme ================= */
function themeNow(){ const a=document.documentElement.dataset.theme; return a||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }
try{ const t=localStorage.getItem('lb-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
function themeChanged(){ readCols(); LABS.forEach(l=>l.draw()); $('#bTheme').setAttribute('aria-label',themeNow()==='dark'?'الوضع الفاتح':'الوضع الداكن'); }
$('#bTheme').onclick=()=>{ const t=themeNow()==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; try{localStorage.setItem('lb-theme',t);}catch(e){} themeChanged(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);

/* ================= teacher mode ================= */
let teachOn=false; const teach=$('#teach'), board=$('#tBoard');
function teachSize(pg){ const W=innerWidth, H=innerHeight; let w,h; if(W/H<1.05){ w=W*.95; h=H*.84; } else { w=Math.min(W*.94,(H*.86)*1.6); h=Math.min(H*.86,w/1.25); w=Math.min(w,h*1.75); }
  const wide=w/h>1.15; pg.classList.toggle('wide',wide); pg.style.width=w+'px'; pg.style.height=h+'px'; pg.style.fontSize=Math.max(13,Math.min(h/(wide?30:40),w/(wide?52:24)))+'px'; }
function teachShow(){ const pg=SP[pos].L; board.querySelectorAll('.page').forEach(p=>{ p.classList.remove('wide','risen'); p.style.cssText=''; store.append(p); });
  pg.classList.remove('risen'); sideOf(pg,'sL'); teachSize(pg); board.replaceChildren(pg); SP[pos].lab.fit(); SP[0].lab[pos===0?'start':'stop']();
  $('#tPrev').disabled=pos===0; $('#tNext').disabled=pos===SP.length-1; setTimeout(()=>pg.classList.add('risen'),80); }
function teachEnter(){ teachOn=true; teach.classList.add('on'); $('#bTeach').classList.add('on'); $('#bTeach').setAttribute('aria-pressed','true'); teachShow(); $('#tExit').focus(); }
function teachExit(){ teachOn=false; teach.classList.remove('on'); $('#bTeach').classList.remove('on'); $('#bTeach').setAttribute('aria-pressed','false');
  board.querySelectorAll('.page').forEach(p=>{ p.classList.remove('wide','risen'); p.style.cssText=''; }); place(); LABS.forEach(l=>l.fit()); }
function teachMove(d){ const n=pos+d; if(n<0||n>=SP.length) return; pos=n; sub=0; sound(); teachShow(); }
$('#bTeach').onclick=()=>teachOn?teachExit():teachEnter(); $('#tExit').onclick=teachExit;
$('#tNext').onclick=()=>teachMove(1); $('#tPrev').onclick=()=>teachMove(-1);

/* ================= init ================= */
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ layout(); if(teachOn) teachSize(SP[pos].L); },120); });
/* resume where the student stopped */
try{ const o=JSON.parse(localStorage.getItem('lb-ch6-pos')||'null'); if(o&&o.pos>=0&&o.pos<SP.length){ pos=o.pos|0; sub=o.sub?1:0; } }catch(e){}
layout();
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg=>{ if(navigator.onLine) reg.update().catch(()=>{}); }).catch(()=>{});
